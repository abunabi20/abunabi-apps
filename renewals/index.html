<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="الانتهاءات">
<meta name="theme-color" content="#0f766e">
<title>متابعة الانتهاءات والتجديدات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../shared/firebase-config.js"></script>
<style>
:root{
  --bg:#f5f2ea;--card:#ffffff;--card2:#faf8f3;--ink:#1f2d2b;--muted:#6b7a76;--line:#e7e1d4;
  --pri:#0f766e;--pri2:#14b8a6;--priSoft:#e3f3ef;
  --amber:#c27a12;--amberSoft:#fdf2df;
  --green:#15803d;--greenSoft:#e5f5ea;
  --red:#c2410c;--redSoft:#fdebe4;
  --blue:#2563eb;--blueSoft:#e6eefc;
  --purple:#7c3aed;--purpleSoft:#f0e9fe;
  --grey:#8a948f;--greySoft:#eeefec;
  --r:18px;--sh:0 6px 22px rgba(31,45,43,.07);
}
[data-theme=dark]{
  --bg:#0f1716;--card:#18221f;--card2:#1d2926;--ink:#e6eeeb;--muted:#93a39e;--line:#2a3733;
  --pri:#2dd4bf;--pri2:#14b8a6;--priSoft:#133a34;
  --amber:#f2b34c;--amberSoft:#3a2d14;--green:#4ade80;--greenSoft:#163322;
  --red:#fb8a5c;--redSoft:#3d1f15;--blue:#7aa7ff;--blueSoft:#18264a;
  --purple:#b69cff;--purpleSoft:#2a2148;--grey:#9aa5a1;--greySoft:#242f2c;
  --sh:0 6px 22px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-size:15px;line-height:1.55}
body{padding-bottom:calc(90px + env(safe-area-inset-bottom))}
button,input,select,textarea{font-family:inherit;font-size:15px}
.top{background:linear-gradient(120deg,#0f766e,#14a38f 60%,#2bb39b);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 54px}
[data-theme=dark] .top{background:linear-gradient(120deg,#0b4d47,#0f766e 60%,#13887a)}
.top .row{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1100px;margin:auto}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:26px}
.brand h1{margin:0;font-size:20px;font-weight:700}.brand p{margin:0;opacity:.85;font-size:13px}
.tops{display:flex;gap:6px;align-items:center}
.sync{font-size:12px;background:rgba(255,255,255,.18);padding:6px 10px;border-radius:999px;white-space:nowrap}
.ibtn{border:0;background:rgba(255,255,255,.18);color:#fff;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:16px}
nav#tabs{position:sticky;top:0;z-index:20;max-width:1100px;margin:-38px auto 0;padding:0 12px}
.tabbar{display:flex;gap:6px;overflow-x:auto;background:var(--card);border-radius:16px;padding:6px;box-shadow:var(--sh);scrollbar-width:none}
.tabbar::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:0;background:transparent;padding:9px 13px;border-radius:12px;color:var(--muted);font-weight:600;cursor:pointer;display:flex;gap:6px;align-items:center}
.tab.on{background:var(--priSoft);color:var(--pri)}
main{max-width:1100px;margin:auto;padding:16px 12px}
h2.sec{font-size:17px;margin:22px 4px 10px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kpi{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--sh);border-top:4px solid var(--c);cursor:default}
.kpi.clk{cursor:pointer}
.kpi .i{font-size:20px}.kpi .l{color:var(--muted);font-size:13px}.kpi .v{font-size:21px;font-weight:700;margin-top:2px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:12px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}.g3{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--s);color:var(--c);white-space:nowrap}
.st-expired{--s:var(--redSoft);--c:var(--red)}
.st-soon{--s:var(--amberSoft);--c:var(--amber)}
.st-ok{--s:var(--greenSoft);--c:var(--green)}
.st-renewing{--s:var(--blueSoft);--c:var(--blue)}
.st-nodate,.st-arch{--s:var(--greySoft);--c:var(--grey)}
.st-info{--s:var(--priSoft);--c:var(--pri)}
.st-purple{--s:var(--purpleSoft);--c:var(--purple)}
.btn{border:0;border-radius:12px;padding:9px 14px;font-weight:600;cursor:pointer;background:var(--pri);color:#fff;display:inline-flex;gap:6px;align-items:center;justify-content:center;text-decoration:none;font-size:14px}
[data-theme=dark] .btn{color:#06231f}
.btn.sec2{background:var(--priSoft);color:var(--pri)}
.btn.ghost{background:var(--greySoft);color:var(--ink)}
.btn.warn{background:var(--redSoft);color:var(--red)}
.btn.wa{background:#e3f6e8;color:#128c4a}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.55}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600;word-break:break-word}
.muted{color:var(--muted)}.small{font-size:13px}.num{direction:ltr;unicode-bidi:embed}
.divider{height:1px;background:var(--line);margin:12px 0}
select,input,textarea{border:1.5px solid var(--line);border-radius:12px;padding:9px 11px;background:var(--card);color:var(--ink);width:100%;outline:none}
select:focus,input:focus,textarea:focus{border-color:var(--pri2)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.filters select,.filters input{width:auto;flex:1 1 140px}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
.form .full{grid-column:1/-1}
.fsec{grid-column:1/-1;font-weight:700;color:var(--pri);margin-top:8px;font-size:15px}
.hint{font-size:12px;color:var(--muted)}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:7px 12px;font-weight:600;cursor:pointer;font-size:13px}
.seg button.on{background:var(--pri);border-color:var(--pri);color:#fff}
[data-theme=dark] .seg button.on{color:#06231f}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
/* بطاقة المتابعة */
.it{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;background:var(--card);border-radius:16px;padding:12px;box-shadow:var(--sh);cursor:pointer;border-right:5px solid var(--c);margin-bottom:10px;transition:.15s}
.it:active{transform:scale(.99)}
.av{width:52px;height:52px;border-radius:14px;background:var(--s);display:grid;place-items:center;font-size:26px;overflow:hidden;flex:0 0 auto;position:relative}
.av img{width:100%;height:100%;object-fit:cover}
.av .tb{position:absolute;bottom:-2px;left:-2px;background:var(--card);border-radius:8px;font-size:13px;padding:0 3px;line-height:18px}
.it .mid{min-width:0}
.it .mid b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .mid small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd{text-align:center;min-width:66px;background:var(--s);color:var(--c);border-radius:14px;padding:6px 8px}
.cd .d{font-size:24px;font-weight:700;line-height:1.1}
.cd small{font-size:11px;font-weight:600;display:block}
.bar{height:7px;border-radius:9px;background:var(--greySoft);overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--c)}
.ghead{font-weight:700;color:var(--muted);font-size:13px;margin:16px 4px 8px;display:flex;align-items:center;gap:6px}
/* البطل */
.hero{background:linear-gradient(135deg,var(--s),var(--card));border-radius:24px;padding:18px;box-shadow:var(--sh);display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;cursor:pointer;border:2px solid var(--s)}
.ring{width:132px;height:132px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--c)}
.ring .in b{font-size:36px;line-height:1;display:block}
.ring .in small{font-size:12px;font-weight:600}
.hero h3{margin:0 0 4px;font-size:18px}.hero .bd{font-size:13px;color:var(--muted)}
.clock{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.clock div{background:var(--card);border-radius:12px;padding:6px 10px;text-align:center;min-width:56px;box-shadow:var(--sh)}
.clock b{display:block;font-size:20px;color:var(--c)}.clock span{font-size:11px;color:var(--muted)}
@media(max-width:480px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center}.clock{justify-content:center}}
/* المساعد */
.asst{display:flex;gap:10px;align-items:flex-start;background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--sh);border-right:4px solid var(--c)}
.asst .ic{font-size:20px}.asst .tx{flex:1}.asst small{color:var(--muted);display:block}
/* الأشخاص */
.pc{background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:14px;cursor:pointer;display:flex;gap:12px;align-items:center}
.pc .ph{width:64px;height:64px;border-radius:18px;background:var(--priSoft);display:grid;place-items:center;font-size:30px;overflow:hidden;flex:0 0 auto}
.pc .ph img{width:100%;height:100%;object-fit:cover}
.pc b{display:block;font-size:16px}.pc small{color:var(--muted);display:block;font-size:12.5px}
.big-ph{width:100%;max-height:260px;object-fit:cover;border-radius:16px;margin-bottom:10px;background:var(--greySoft)}
.gallery{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.gallery img{width:96px;height:96px;object-fit:cover;border-radius:12px;cursor:pointer;border:1px solid var(--line)}
/* المودال */
.modal{position:fixed;inset:0;background:rgba(10,20,18,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal.hidden{display:none}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
@media(min-width:760px){.modal{align-items:center}.sheet{border-radius:24px}}
.sheet h3{margin:0 0 12px;font-size:18px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.x{border:0;background:var(--greySoft);color:var(--ink);width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;flex:0 0 auto}
#toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(200px);background:#1f2d2b;color:#fff;padding:11px 18px;border-radius:14px;z-index:80;transition:.25s;font-size:14px;max-width:90vw}
#toast.on{transform:translateX(-50%) translateY(0)}
/* زر الإضافة */
.fab{position:fixed;left:18px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:40;display:flex;gap:10px}
.fab button{border:0;border-radius:18px;height:56px;padding:0 18px;font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 10px 26px rgba(15,118,110,.35);display:flex;gap:8px;align-items:center}
.fab .cam{background:var(--pri);color:#fff}.fab .plus{background:var(--card);color:var(--pri);width:56px;padding:0;justify-content:center;font-size:26px}
[data-theme=dark] .fab .cam{color:#06231f}
/* جداول وتقارير */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
th{color:var(--muted);font-weight:600;background:var(--card2)}
.tbl{overflow-x:auto;border-radius:14px;border:1px solid var(--line);background:var(--card)}
tfoot td{font-weight:700;background:var(--card2)}
.hbars{display:flex;flex-direction:column;gap:7px}
.hb{display:grid;grid-template-columns:110px 1fr 90px;gap:8px;align-items:center;font-size:12.5px}
.hb .tr{height:12px;border-radius:6px;background:var(--greySoft);overflow:hidden}.hb .tr i{display:block;height:100%;background:linear-gradient(90deg,var(--pri2),var(--pri));border-radius:6px}
.hb .tr i.red{background:linear-gradient(90deg,#fb923c,var(--red))}
.vbars{display:flex;gap:6px;align-items:flex-end;height:150px;padding-top:10px}
.vb{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font-size:10.5px;color:var(--muted)}
.vb i{width:100%;max-width:34px;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,var(--pri2),var(--pri));min-height:2px}
.vb b{font-size:10px;color:var(--ink)}
.rep{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.rhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;border-bottom:3px solid var(--pri);padding-bottom:10px;margin-bottom:14px}
.rhead h2{margin:0;font-size:19px}.rhead small{color:var(--muted)}
.rsum{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-bottom:14px}
.rsum div{background:var(--card2);border-radius:12px;padding:10px;border:1px solid var(--line)}
.rsum span{display:block;font-size:12px;color:var(--muted)}.rsum b{font-size:17px}
.rfoot{margin-top:16px;font-size:11px;color:var(--muted);text-align:center;border-top:1px solid var(--line);padding-top:8px}
.qbox{border:1.5px dashed var(--pri2);background:var(--priSoft);border-radius:14px;padding:12px;margin-bottom:12px}
.qbox b{display:block;margin-bottom:6px;color:var(--pri)}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.opts button{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.opts button img{width:22px;height:22px;border-radius:50%;object-fit:cover}
.opts button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.prog{height:10px;background:var(--greySoft);border-radius:9px;overflow:hidden;margin:12px 0}.prog i{display:block;height:100%;width:0;background:var(--pri);transition:.3s}
.spin{display:inline-block;width:18px;height:18px;border:3px solid var(--priSoft);border-top-color:var(--pri);border-radius:50%;animation:sp 1s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.cal .m{background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:12px}
.cal .m h4{margin:0 0 8px;font-size:15px;display:flex;justify-content:space-between}
.cal .e{display:flex;gap:8px;align-items:center;font-size:13px;padding:6px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.cal .e:last-child{border:0}.cal .e .dd{background:var(--s);color:var(--c);border-radius:8px;padding:1px 7px;font-weight:700;font-size:12px;min-width:30px;text-align:center}
.score{font-size:42px;font-weight:700}
.printonly{display:none}
#login{position:fixed;inset:0;z-index:90;background:linear-gradient(140deg,#0f766e,#14a38f 55%,#e9dcc0);display:flex;align-items:center;justify-content:center;padding:20px}
#login.hidden{display:none}
.lbox{background:#fff;color:#1f2d2b;border-radius:26px;padding:28px 22px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.18);text-align:center}
.lbox .logo{margin:0 auto 10px;background:#e3f3ef;width:64px;height:64px;font-size:34px}
.lbox h2{margin:4px 0 2px;font-size:20px}.lbox p{margin:0 0 18px;color:#6b7a76;font-size:13px}
.lbox input{margin-bottom:10px;text-align:right;background:#fff;color:#1f2d2b;border-color:#e7e1d4}
.lbox .btn{width:100%;padding:12px;font-size:15px;color:#fff;background:#0f766e}
.lerr{color:#c2410c;font-size:13px;min-height:18px;margin-bottom:6px}
@media print{
  :root,[data-theme=dark]{--bg:#fff;--card:#fff;--card2:#f6f6f4;--ink:#111;--muted:#555;--line:#ddd;--sh:none}
  body{background:#fff;padding:0}
  .top,nav,.fab,#toast,.noprint,.modal{display:none!important}
  main{padding:0;max-width:none}.rep{box-shadow:none;padding:0}
  .printonly{display:block}
  tr,.it{break-inside:avoid}
}
</style>
</head>
<body>
<header class="top">
  <div class="row">
    <div class="brand"><div class="logo">⏳</div><div><h1>متابعة الانتهاءات</h1><p id="bSub">الوثائق والتجديدات والمواعيد</p></div></div>
    <div class="tops"><button class="ibtn" onclick="toggleTheme()" title="الوضع الليلي">🌓</button><div class="sync" id="sync">⏳ جاري التحميل</div></div>
  </div>
</header>
<nav id="tabs"><div class="tabbar" id="tabbar"></div></nav>
<main id="main"><div class="empty">جاري تحميل البيانات...</div></main>
<div class="fab noprint" id="fab"><button class="plus" onclick="addMenu()" title="إضافة">＋</button><button class="cam" onclick="startScan()">📸 صوّر وأضف</button></div>
<input type="file" id="scanFile" accept="image/*" multiple hidden>
<input type="file" id="photoFile" accept="image/*" hidden>
<input type="file" id="restoreFile" accept=".json,application/json" hidden>
<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<div id="login"><div class="lbox"><div class="logo">⏳</div><h2>متابعة الانتهاءات</h2><p>سجّل دخولك بإيميلك وكلمة المرور</p>
<form id="lform"><input id="lemail" type="email" autocomplete="username" placeholder="الإيميل" dir="ltr" required>
<input id="lpass" type="password" autocomplete="current-password" placeholder="كلمة المرور" dir="ltr" required>
<div class="lerr" id="lerr"></div><button class="btn" type="submit" id="lbtn">دخول</button></form>
<p style="margin:14px 0 0"><a href="#" id="lreset" style="color:#0f766e;font-size:13px">نسيت كلمة المرور؟</a></p></div></div>

<script>
/* ================= الأنواع الافتراضية (كلها قابلة للتعديل من الإعدادات) ================= */
const TYPES={
  iqama:{l:'إقامة',ic:'🪪',owner:'person',alert:60,period:12,cost:600,fine:{k:'fixed',a:500,rep:1000,grace:3},
    where:'أبشر أفراد: خدمات المكفولين ← تجديد الإقامة',req:'جواز ساري، تأمين طبي ساري إن لزم، سداد الرسوم والمقابل المالي',kw:['إقامة','اقامة','هوية مقيم','resident identity','iqama','مقيم']},
  passport:{l:'جواز سفر',ic:'🛂',owner:'person',alert:30,period:60,cost:300,fine:{k:'none'},
    where:'أبشر (للسعوديين) أو سفارة بلد العامل',tip:'أغلب الدول تشترط صلاحية 6 أشهر على الأقل وقت السفر',kw:['passport','جواز','جواز سفر','passeport','P<']},
  national_id:{l:'هوية وطنية',ic:'🆔',owner:'person',alert:30,period:120,cost:0,fine:{k:'fixed',a:100,rep:200,grace:0},est:true,

  driving_license:{l:'رخصة قيادة',ic:'🚘',owner:'person',alert:30,period:120,cost:400,fine:{k:'perYear',a:100,grace:0},

const HF=(()=>{try{return new Intl.DateTimeFormat('en-u-ca-islamic-umalqura-nu-latn',{day:'numeric',month:'numeric',year:'numeric'})}catch(e){return null}})();
function g2hParts(d){if(!HF)return null;const p={};HF.formatToParts(d).forEach(x=>{if(x.type==='year')p.y=parseInt(x.value);if(x.type==='month')p.m=parseInt(x.value);if(x.type==='day')p.d=parseInt(x.value)});return p}
const hij=s=>{try{return new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-latn',{day:'numeric',month:'long',year:'numeric'}).format(pd(s))}catch(e){return ''}};
const hijS=s=>{const p=s&&g2hParts(pd(s));return p?`${String(p.d).padStart(2,'0')}/${String(p.m).padStart(2,'0')}/${p.y}هـ`:''};
function h2g(y,m,d){ // تحويل هجري (أم القرى) إلى ميلادي
  y=+y;m=+m;d=+d;if(!HF||!y||!m||!d)return null;
  const approx=new Date(622,6,16);approx.setDate(approx.getDate()+Math.round((y-1)*354.367+(m-1)*29.5306+d-1));
  for(let k=-25;k<=25;k++){const t=addDays(approx,k);const p=g2hParts(t);if(p.y===y&&p.m===m&&p.d===d)return iso(t)}
  if(d===30)return h2g(y,m,29);return null}
function parseHijriText(t){const m=toEn(t).match(/(\d{1,4})\D+(\d{1,2})\D+(\d{1,4})/);if(!m)return null;let a=+m[1],b=+m[2],c=+m[3];
  if(a>1300)return h2g(a,b,c);if(c>1300)return h2g(c,b,a);return null}

/* ================= منطق المتابعة ================= */
function T(k){const b=TYPES[k]||TYPES.other;const o=(ST().types||{})[k]||{};return {...b,...o,fine:{...b.fine,...(o.fine||{})}}}
const tLabel=it=>it.type==='other'||it.type==='subscription'?(it.title||T(it.type).l):T(it.type).l;
function dueDate(it){
  if(T(it.type).periodic){if(!it.lastDone)return null;return iso(addMonths(pd(it.lastDone),+(it.interval||T(it.type).interval)))}
  return it.expiry||null}
function daysLeft(it){const d=dueDate(it);return d?dBetween(today(),d):null}
const alertOf=it=>+(it.alert!=null&&it.alert!==''?it.alert:T(it.type).alert);
function status(it){
  if(it.state==='archived')return 'arch';
  const dl=daysLeft(it);if(dl==null)return 'nodate';
  if(it.state==='renewing')return 'renewing';
  if(dl<0)return 'expired';if(dl<=alertOf(it))return 'soon';return 'ok'}
function fineRule(it){const f={...T(it.type).fine};if(it.fineA!=null&&it.fineA!==''){f.a=+it.fineA;if(f.k==='none')f.k='fixed'}return f}
function fineAt(it,asOf){ // الغرامة المتراكمة حتى تاريخ معين لو ما تجدد
  const d=dueDate(it);if(!d||T(it.type).periodic||it.state==='archived')return 0;
  const f=fineRule(it);if(!f||f.k==='none')return 0;
  const late=dBetween(d,asOf||today());if(late<=(+f.grace||0))return 0;
  const a=+(it.repeat&&f.rep?f.rep:f.a)||0;
  let r={fixed:a,perYear:Math.ceil(late/365)*a,perMonth:Math.ceil(late/30)*a,perDay:late*a}[f.k]||0;
  if(f.max)r=Math.min(r,+f.max);return r}
const costOf=it=>+(it.cost!=null&&it.cost!==''?it.cost:T(it.type).cost)||0;
const periodOf=it=>+(it.period||T(it.type).period||12);
function ownerOf(it){if(it.ownerKind==='person')return S.people[it.ownerId];if(it.ownerKind==='vehicle')return S.vehicles[it.ownerId];return null}
function ownerLabel(it){const o=ownerOf(it);if(!o)return it.ownerKind==='none'?'عام':'غير محدد';return it.ownerKind==='vehicle'?vName(o):o.name}
const vName=c=>[c.name||[c.make,c.model].filter(Boolean).join(' ')||'سيارة',c.plate?('('+c.plate+')'):''].join(' ').trim();
function ownerKindKey(it){if(it.ownerKind==='vehicle')return 'car';const o=ownerOf(it);return o?o.rel||'other':'none'}
const activeItems=()=>Object.values(S.items).filter(i=>i.state!=='archived');
function countdownParts(days){const a=Math.abs(days);const y=Math.floor(a/365),m=Math.floor((a%365)/30),d=a%365%30;return{y,m,d}}
function humanDays(dl){if(dl==null)return 'بدون تاريخ';if(dl===0)return 'ينتهي اليوم';
  const p=countdownParts(dl);const s=[p.y?p.y+' سنة':'',p.m?p.m+' شهر':'',p.d?p.d+' يوم':''].filter(Boolean).join(' و ');
  return dl<0?'منتهي منذ '+s:'باقي '+s}
function pctUsed(it){const d=dueDate(it);if(!d)return 0;
  let start=it.issue||(T(it.type).periodic?it.lastDone:null);if(!start)start=iso(addMonths(pd(d),-periodOf(it)));
  const tot=dBetween(start,d)||1;return Math.max(0,Math.min(100,Math.round(dBetween(start,today())/tot*100)))}
function avatarHTML(it,size){const o=ownerOf(it);const t=T(it.type);
  const ph=o&&o.photo?`<img src="${o.photo}" alt="">`:(it.ownerKind==='vehicle'?'🚗':(o?(REL[o.rel]||REL.other).ic:t.ic));
  return `<div class="av"${size?` style="width:${size}px;height:${size}px"`:''}>${ph}${o&&o.photo||it.ownerKind==='vehicle'||o?`<span class="tb">${t.ic}</span>`:''}</div>`}
function itemCard(it){const st=status(it),dl=daysLeft(it),fine=fineAt(it);
  const big=dl==null?'؟':Math.abs(dl);const unit=dl==null?'بدون تاريخ':dl<0?'يوم تأخير':dl===0?'اليوم':'يوم باقي';
  const sub=[it.number?'<span class="num">'+esc(maskNum(it))+'</span>':'',dueDate(it)?fd(dueDate(it))+' · '+hijS(dueDate(it)):''].filter(Boolean).join(' · ');
  return `<div class="it st-${st}" onclick="openItem('${it._id}')">${avatarHTML(it)}
  <div class="mid"><b>${t_ic(it)} ${esc(tLabel(it))} · ${esc(ownerLabel(it))}</b><small>${sub||'&nbsp;'}</small>
  <small>${st==='expired'&&fine?`<span class="chip st-expired">غرامة متوقعة ${money(fine)}</span> `:''}${st==='renewing'?'<span class="chip st-renewing">قيد التجديد</span> ':''}${esc(humanDays(dl))}</small>
  <div class="bar"><i style="width:${pctUsed(it)}%"></i></div></div>
  <div class="cd"><div class="d">${big}</div><small>${unit}</small></div></div>`}
const t_ic=it=>T(it.type).ic;
function maskNum(it){const n=String(it.number||'');if(it.type==='bank_card')return '•••• '+n.slice(-4);return n}
function sortItems(a,mode){const key={
  near:i=>{const d=daysLeft(i);return d==null?1e9:d},
  type:i=>TYPE_ORDER.indexOf(i.type)*1e6+(daysLeft(i)??1e5),
  owner:i=>ownerLabel(i),
  cost:i=>-(costOf(i)+fineAt(i))}[mode]||(i=>0);
  return a.slice().sort((x,y)=>{const p=key(x),q=key(y);return typeof p==='string'?p.localeCompare(q,'ar'):p-q})}

function kpi(i,l,val,c,click){return`<div class="kpi ${click?'clk':''}" style="--c:var(--${c})" ${click?`onclick="${click}"`:''}><div class="i">${i}</div><div class="l">${l}</div><div class="v">${val}</div></div>`}

function stats(){const A=activeItems();const by={expired:[],soon:[],ok:[],renewing:[],nodate:[]};A.forEach(i=>(by[status(i)]||by.nodate).push(i));
  const dated=A.filter(i=>daysLeft(i)!=null);const score=dated.length?Math.round(dated.filter(i=>status(i)!=='expired').length/dated.length*100):100;
  const fines=sum(by.expired,fineAt);
  const within=(n)=>A.filter(i=>{const d=daysLeft(i);return d!=null&&d<=n});
  return{A,by,score,fines,c90:sum(within(90),costOf),c365:sum(within(365),costOf)}}

function insights(){const out=[];const P=Object.values(S.people),V=Object.values(S.vehicles),A=activeItems();
  const has=(kind,id,type)=>A.some(i=>i.ownerKind===kind&&i.ownerId===id&&i.type===type);
  const self=P.find(p=>p.rel==='self');
  if(!self)out.push({c:'blue',ic:'🙋‍♂️',t:'ما أضفت نفسك للحين',s:'أضف نفسك عشان نربط جوازك وهويتك ورخصتك وعمرتك فيك',a:`editPerson(null,{rel:'self',name:ownerName()})`,b:'إضافة'});
  P.filter(p=>p.rel==='worker').forEach(p=>{
    if(!has('person',p._id,'iqama'))out.push({c:'amber',ic:'🪪',t:`ما سجلت إقامة ${p.name}`,s:'الإقامة أهم شي للعمالة، غرامة تأخيرها تبدأ من 500 ريال',a:`quickAdd('iqama','person','${p._id}')`,b:'إضافة'});
    if(!has('person',p._id,'passport'))out.push({c:'blue',ic:'🛂',t:`جواز ${p.name} غير مسجل`,s:'تجديد الإقامة يحتاج جواز ساري',a:`quickAdd('passport','person','${p._id}')`,b:'إضافة'})});
  V.forEach(c=>{['istimara','insurance','inspection'].forEach(t=>{if(!has('vehicle',c._id,t))out.push({c:'amber',ic:TYPES[t].ic,t:`${TYPES[t].l} ${vName(c)} غير مسجل`,s:'سجله عشان ننبهك قبل انتهائه',a:`quickAdd('${t}','vehicle','${c._id}')`,b:'إضافة'})});
    const ist=A.find(i=>i.ownerKind==='vehicle'&&i.ownerId===c._id&&i.type==='istimara'&&dueDate(i));
    ['insurance','inspection'].forEach(t=>{const x=A.find(i=>i.ownerKind==='vehicle'&&i.ownerId===c._id&&i.type===t&&dueDate(i));
      if(ist&&x&&daysLeft(ist)<=60&&dueDate(x)<dueDate(ist))out.push({c:'purple',ic:'🔗',t:`انتبه: ${TYPES[t].l} ${vName(c)} ينتهي قبل الاستمارة`,s:`تجديد الاستمارة يحتاج ${TYPES[t].l} ساري، جدده أول (${fd(dueDate(x))})`,a:`openItem('${x._id}')`,b:'عرض'})})});
  if(self&&!has('person',self._id,'umrah'))out.push({c:'purple',ic:'🕋',t:'متى آخر عمرة لك؟',s:'سجلها ويذكرك البرنامج قبل ما تعدي سنتين',a:`quickAdd('umrah','person','${self._id}')`,b:'سجّل'});
  if(self&&!has('person',self._id,'hajj'))out.push({c:'purple',ic:'🕋',t:'متى آخر حجة لك؟',s:'سجلها ويذكرك قبل موعد الحج القادم بفترة كافية للتسجيل',a:`quickAdd('hajj','person','${self._id}')`,b:'سجّل'});
  A.filter(i=>i.type==='passport'&&daysLeft(i)!=null&&daysLeft(i)>=0&&daysLeft(i)<183).forEach(i=>out.push({c:'blue',ic:'✈️',t:`جواز ${ownerLabel(i)} صلاحيته أقل من 6 أشهر`,s:'أغلب الدول ترفض الدخول بجواز صلاحيته أقل من 6 أشهر',a:`openItem('${i._id}')`,b:'عرض'}));
  A.filter(i=>i.type==='iqama').forEach(i=>{const pp=A.find(x=>x.type==='passport'&&x.ownerId===i.ownerId&&dueDate(x));if(pp&&dueDate(i)&&dueDate(pp)<iso(addMonths(pd(dueDate(i)),periodOf(i))))out.push({c:'amber',ic:'🔗',t:`جواز ${ownerLabel(i)} ينتهي قبل نهاية الإقامة القادمة`,s:'جدد الجواز أول عشان ما يتعطل تجديد الإقامة',a:`openItem('${pp._id}')`,b:'عرض'})});
  const noDate=A.filter(i=>!dueDate(i));if(noDate.length)out.push({c:'red',ic:'❓',t:`${noDate.length} متابعة بدون تاريخ`,s:noDate.slice(0,3).map(i=>tLabel(i)+' '+ownerLabel(i)).join('، '),a:`openItem('${noDate[0]._id}')`,b:'أكمل'});
  const noCost=A.filter(i=>!costOf(i)&&!['bank_card','passport','work_permit','medical_ins','driver_auth'].includes(i.type));if(noCost.length)out.push({c:'grey',ic:'💰',t:`${noCost.length} متابعة بدون تكلفة تجديد`,s:'أضف التكلفة عشان تطلع تقارير المصاريف دقيقة',a:`openItem('${noCost[0]._id}')`,b:'أكمل'});
  if(!ST().notifyAsked&&'Notification' in window&&Notification.permission==='default')out.push({c:'blue',ic:'🔔',t:'فعّل التنبيهات على هذا الجهاز',s:'وأضف المواعيد لتقويم جوالك عشان يجيك تنبيه حتى لو البرنامج مقفل',a:`go('set')`,b:'الإعدادات'});
  return out}

function vItems(){

  const segs=[['active','الكل'],['expired','⛔ منتهي'],['soon','⚠️ قريب'],['ok','✅ ساري'],['renewing','🔄 قيد التجديد'],['nodate','❓ بدون تاريخ'],['arch','🗄️ الأرشيف']];
  let list='';
  if(F.sort==='type'||F.sort==='owner'){const g={};A.forEach(i=>{const k=F.sort==='type'?tLabel(i):ownerLabel(i);(g[k]=g[k]||[]).push(i)});
    list=Object.entries(g).map(([k,a])=>`<div class="ghead">${F.sort==='type'?t_ic(a[0]):'👤'} ${esc(k)} <span class="chip st-info">${a.length}</span></div>${a.map(itemCard).join('')}`).join('')}
  else list=A.map(itemCard).join('');

   <input id="fq" placeholder="🔍 بحث بالاسم أو الرقم" value="${esc(F.q)}" oninput="F.q=this.value;clearTimeout(window._q);window._q=setTimeout(()=>{render();const e=$('#fq');e.focus();e.setSelectionRange(e.value.length,e.value.length)},350)">
   <select onchange="F.sort=this.value;render()"><option value="near" ${F.sort==='near'?'selected':''}>↕️ الأقرب انتهاءً</option><option value="type" ${F.sort==='type'?'selected':''}>↕️ حسب النوع</option><option value="owner" ${F.sort==='owner'?'selected':''}>↕️ حسب الشخص/السيارة</option><option value="cost" ${F.sort==='cost'?'selected':''}>↕️ الأعلى تكلفة</option></select>
   <select onchange="F.kind=this.value;render()"><option value="all">كل الفئات</option>${Object.entries(REL).map(([k,r])=>`<option value="${k}" ${F.kind===k?'selected':''}>${r.ic} ${r.l}</option>`).join('')}<option value="car" ${F.kind==='car'?'selected':''}>🚗 السيارات</option><option value="none" ${F.kind==='none'?'selected':''}>📌 عام</option></select>

  </div>
  <p class="small muted">${A.length} متابعة</p>
  ${list||'<div class="card empty">لا توجد نتائج</div>'}`}
const norm=s=>String(s||'').toLowerCase().replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي');

async function saveCar(id){const cid=id||uid('v');const o={...(id?clean(S.vehicles[id]):{createdAt:Date.now()}),name:v('cName'),make:v('cMake'),model:v('cModel'),year:v('cYear'),color:v('cColor'),plate:v('cPlate'),vin:v('cVin'),serial:v('cSerial'),driverId:v('cDriver'),notes:v('cNotes'),photo:tmpPhoto||''};

async function delCar(id){const n=carItems(id).length;if(!await ask(`حذف السيارة؟${n?` وبتنحذف معها ${n} متابعات.`:''}`,'حذف'))return;
  for(const i of Object.values(S.items).filter(i=>i.ownerKind==='vehicle'&&i.ownerId===id)){await delItemData(i)}await dbDel('vehicles/'+id);closeModal();toast('تم الحذف')}

/* ---------- الصور ---------- */
function compress(file,max=1100,q=.72){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const im=new Image();
  im.onload=()=>{let w=im.naturalWidth,h=im.naturalHeight;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
    const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',q))};
  im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('img'))};im.src=u})}
function pickPhoto(prevId){const inp=$('#photoFile');inp.value='';inp.onchange=async()=>{const f=inp.files[0];if(!f)return;try{tmpPhoto=await compress(f,420,.75);const e=document.getElementById(prevId);if(e)e.innerHTML=`<img src="${tmpPhoto}">`}catch(e){toast('تعذر قراءة الصورة')}};inp.click()}
async function viewImg(id){const d=await imgGet(id);if(!d){toast('الصورة غير متوفرة');return}const w=window.open('');if(w){w.document.write(`<title>صورة</title><body style="margin:0;background:#111;display:grid;place-items:center;min-height:100vh"><img src="${d}" style="max-width:100%;max-height:100vh">`)}else openModal(`<h3>صورة<button class="x" onclick="closeModal()">×</button></h3><img src="${d}" style="width:100%;border-radius:14px">`)}

  <dl class="kv">${it.number?`<dt>الرقم</dt><dd class="num">${esc(maskNum(it))}</dd>`:''}${it.provider?`<dt>${it.type==='bank_card'?'البنك':'الجهة'}</dt><dd>${esc(it.provider)}</dd>`:''}
   ${t.periodic?`<dt>آخر مرة</dt><dd>${fd(it.lastDone)}</dd><dt>كل</dt><dd>${+(it.interval||t.interval)} شهر</dd>`:`${it.issue?`<dt>الإصدار</dt><dd>${fd(it.issue)} · ${hijS(it.issue)}</dd>`:''}<dt>الانتهاء</dt><dd>${fd(it.expiry)} · ${hijS(it.expiry)}</dd>`}
   <dt>التنبيه قبل</dt><dd>${alertOf(it)} يوم${d?' ('+fd(iso(addDays(pd(d),-alertOf(it))))+')':''}</dd>
   <dt>تكلفة التجديد</dt><dd>${money(costOf(it))}</dd>
   <dt>الغرامة</dt><dd>${f.k==='none'?'لا يوجد':`${nf(it.repeat&&f.rep?f.rep:f.a)} ر.س ${FINE_K[f.k]}${+f.grace?` (مهلة ${f.grace} أيام)`:''}${t.est&&it.fineA==null?' · تقديرية':''}`}</dd>
   ${t.where?`<dt>مكان التجديد</dt><dd>${esc(t.where)}</dd>`:''}${t.req?`<dt>المتطلبات</dt><dd>${esc(t.req)}</dd>`:''}${t.tip?`<dt>تنبيه</dt><dd>${esc(t.tip)}</dd>`:''}${it.notes?`<dt>ملاحظات</dt><dd>${esc(it.notes)}</dd>`:''}</dl>
  ${f.k!=='none'&&d&&!t.periodic?`<div class="card" style="margin-top:12px;background:var(--redSoft)"><b>💸 لو أهملته</b><div class="small" style="margin-top:6px">${[30,90,180,365].map(n=>{const at=iso(addDays(pd(d>today()?d:today()),n));return `بعد ${n} يوم: <b>${money(fineAt(it,at)+costOf(it))}</b> (تجديد + غرامة)`}).join('<br>')}</div></div>`:''}
  ${(it.imgs||[]).length?`<div class="gallery">${it.imgs.map(x=>`<img data-img="${x}" onclick="viewImg('${x}')" alt="">`).join('')}</div>`:''}
  <div class="btns"><button class="btn" onclick="renewItem('${id}')">${t.periodic?'✅ سجّل أنك أديتها':'🔄 تم التجديد'}</button>
   ${!t.periodic&&it.state!=='renewing'?`<button class="btn sec2" onclick="setState('${id}','renewing')">⏳ قيد التجديد</button>`:''}${it.state==='renewing'?`<button class="btn sec2" onclick="setState('${id}','active')">↩️ إلغاء قيد التجديد</button>`:''}
   <button class="btn ghost" onclick="editItem('${id}')">✏️ تعديل</button><button class="btn ghost" onclick="addImgs('${id}')">📎 إضافة صورة</button><button class="btn ghost" onclick="dlICS(['${id}'])">📅 للتقويم</button>
   ${it.state==='archived'?`<button class="btn ghost" onclick="setState('${id}','active')">↩️ استرجاع</button>`:`<button class="btn ghost" onclick="setState('${id}','archived')">🗄️ أرشفة</button>`}<button class="btn warn" onclick="delItem('${id}')">🗑️</button></div>
  ${hist.length?`<h4 style="margin:16px 0 6px">سجل التجديدات</h4><div class="tbl"><table><tr><th>التاريخ</th><th>من</th><th>إلى</th><th>التكلفة</th><th>غرامة</th></tr>${hist.map(h=>`<tr><td>${fd(h.renewedOn)}</td><td>${fd(h.oldDue)}</td><td>${fd(h.newDue)}</td><td>${nf(h.cost)}</td><td>${+h.fine?nf(h.fine):'-'}</td></tr>`).join('')}</table></div>`:''}`);
  document.querySelectorAll('#sheet img[data-img]').forEach(async im=>{im.src=await imgGet(im.dataset.img)||''})}
async function setState(id,state){await dbSet('items/'+id,{...clean(S.items[id]),state});toast('تم ✓');closeModal()}
async function delItemData(it){for(const x of it.imgs||[])await imgDel(x);await dbDel('items/'+it._id)}
async function delItem(id){if(!await ask('حذف هذه المتابعة نهائياً مع صورها؟ (الأرشفة تحتفظ فيها)','حذف'))return;await delItemData(S.items[id]);closeModal();toast('تم الحذف')}
function addImgs(id){const inp=$('#scanFile');inp.value='';inp.onchange=async()=>{const it=S.items[id];const ids=[...(it.imgs||[])];
  for(const f of inp.files){try{ids.push(await imgPut(await compress(f)))}catch(e){toast('تعذر رفع صورة')}}
  await dbSet('items/'+id,{...clean(S.items[id]),imgs:ids});toast('تمت إضافة الصور ✓');closeModal();setTimeout(()=>openItem(id),300)};inp.click()}

function renewItem(id){const it=S.items[id],t=T(it.type);const d=dueDate(it);
  const base0=t.periodic?today():(d&&d>today()?d:today());const sug=t.periodic?today():iso(addMonths(pd(d||today()),periodOf(it)));
  const lateFine=fineAt(it);
  openModal(`<h3>${t.periodic?'تسجيل أداء ':'تجديد '}${esc(tLabel(it))}<button class="x" onclick="closeModal()">×</button></h3>
  <p class="small muted">${esc(ownerLabel(it))}${d?' · كان '+fd(d):''}</p>
  <div class="form">${t.periodic?`<label>تاريخ الأداء<input type="date" id="rNew" value="${today()}"></label>`:`
   <label>تاريخ الانتهاء الجديد<input type="date" id="rNew" value="${sug}"></label>
   <label>أو بالهجري<input id="rHij" placeholder="1449/05/20" oninput="const g=parseHijriText(this.value);if(g){$('#rNew').value=g;$('#rHijOut').textContent='= '+fd(g)}"><span class="hint" id="rHijOut"></span></label>
   <div class="full opts">${[1,2,3,5,10].map(y=>`<button type="button" onclick="$('#rNew').value='${iso(addMonths(pd(d||today()),y*12))}'">+${y} ${y===1?'سنة':y===2?'سنتين':'سنوات'}</button>`).join('')}</div>`}
   <label>المبلغ المدفوع<input id="rCost" inputmode="decimal" value="${costOf(it)||''}"></label>
   <label>غرامة مدفوعة<input id="rFine" inputmode="decimal" value="${lateFine||''}"></label>
   <label class="full">ملاحظة<input id="rNote"></label>
   <label class="full" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" id="rImg" style="width:auto"> أبغى أصور المستند الجديد بعد الحفظ</label></div>
  <div class="btns"><button class="btn" onclick="doRenew('${id}')">💾 حفظ</button></div>`)}
async function doRenew(id){const it=S.items[id],t=T(it.type);const nd=v('rNew');if(!nd){toast('حدد التاريخ');return}
  const old=dueDate(it);const late=old&&!t.periodic?Math.max(0,dBetween(old,today())):0;
  const h={itemId:id,type:it.type,title:tLabel(it),ownerKind:it.ownerKind||'',ownerId:it.ownerId||'',ownerLabel:ownerLabel(it),oldDue:old||'',newDue:t.periodic?iso(addMonths(pd(nd),+(it.interval||t.interval))):nd,renewedOn:t.periodic?nd:today(),cost:+v('rCost')||0,fine:+v('rFine')||0,lateDays:late,note:v('rNote')};
  await dbSet('history/'+uid('h'),h);
  const upd={...clean(it),state:'active'};if(t.periodic)upd.lastDone=nd;else{upd.issue=old&&old<today()?today():(old||today());upd.expiry=nd}
  if(late>(+fineRule(it).grace||0)&&fineRule(it).k!=='none')upd.repeat=true; // المرة القادمة تعتبر تكرار
  await dbSet('items/'+id,upd);toast('تم التجديد ✓');closeModal();if($('#rImg')&&$('#rImg').checked)addImgs(id)}

function ownerSelectHTML(kind,id,type){const P=Object.values(S.people),V=Object.values(S.vehicles);const want=type?T(type).owner:'any';
  const opt=(k,o,l,ph)=>`<button type="button" class="${kind===k&&id===o?'on':''}" onclick="selOwner('${k}','${o}')">${ph?`<img src="${ph}">`:''}${esc(l)}</button>`;
  return `<div class="opts" id="ownerOpts">${want!=='vehicle'?P.map(p=>opt('person',p._id,p.name,p.photo)).join(''):''}${want!=='person'?V.map(c=>opt('vehicle',c._id,'🚗 '+vName(c),c.photo)).join(''):''}

   ${want!=='vehicle'?`<button type="button" onclick="newOwnerFromForm('person')">➕ شخص جديد</button>`:''}${want!=='person'?`<button type="button" onclick="newOwnerFromForm('vehicle')">➕ سيارة جديدة</button>`:''}</div>`}

function selOwner(k,id){formOwner={kind:k,id};document.querySelectorAll('#ownerOpts button').forEach(b=>b.classList.remove('on'));event.currentTarget.classList.add('on')}

function editItem(id,pre){const it=id?S.items[id]:{state:'active',...(pre||{})};formOwner={kind:it.ownerKind||'',id:it.ownerId||''};

function itemFormHTML(it,type){const t=type?T(type):null;
  return `<div class="form"><label class="full">النوع<select id="iType" onchange="retype()"><option value="">اختر النوع</option>${TYPE_ORDER.map(k=>`<option value="${k}" ${type===k?'selected':''}>${TYPES[k].ic} ${T(k).l}</option>`).join('')}</select></label>
  <div class="full" id="iOwnerWrap"><div class="small muted" style="margin-bottom:4px">لمن؟</div>${ownerSelectHTML(formOwner.kind,formOwner.id,type)}</div>
  <div class="full form" id="iDyn" style="grid-template-columns:inherit">${dynFields(it,type)}</div></div>`}
function dynFields(it,type){const t=type?T(type):T('other');
  if(t.periodic)return `<label>آخر مرة أديتها<input type="date" id="iLast" value="${esc(it.lastDone||'')}"></label>
   <label>أو بالهجري<input id="iLastH" placeholder="1447/09/15" oninput="const g=parseHijriText(this.value);if(g)$('#iLast').value=g"></label>
   <label>التكرار كل (شهر)<input id="iInt" inputmode="numeric" value="${esc(it.interval||t.interval)}"></label>
   <label>نبهني قبل (يوم)<input id="iAlert" inputmode="numeric" value="${esc(it.alert??t.alert)}"></label>
   <label>التكلفة المتوقعة<input id="iCost" inputmode="decimal" value="${esc(it.cost??t.cost)}"></label>
   <label class="full">ملاحظات<textarea id="iNotes" rows="2">${esc(it.notes)}</textarea></label>`;
  return `${type==='other'||type==='subscription'||!type?`<label class="full">العنوان<input id="iTitle" value="${esc(it.title)}" placeholder="مثلاً: سجل تجاري، اشتراك نت، رخصة بلدية"></label>`:''}
   <label>${type==='bank_card'?'آخر 4 أرقام':'الرقم'}<input id="iNum" dir="ltr" value="${esc(type==='bank_card'?String(it.number||'').slice(-4):it.number)}" ${type==='bank_card'?'maxlength="4" inputmode="numeric"':''}></label>
   <label>${type==='bank_card'?'البنك':'الجهة / الشركة'}<input id="iProv" value="${esc(it.provider)}"></label>
   <label>تاريخ الإصدار<input type="date" id="iIssue" value="${esc(it.issue||'')}"></label>
   <label>تاريخ الانتهاء<input type="date" id="iExp" value="${esc(it.expiry||'')}" oninput="$('#iExpH').placeholder=hijS(this.value)||'1449/05/20'"></label>
   <label>الانتهاء بالهجري<input id="iExpH" placeholder="${it.expiry?hijS(it.expiry):'1449/05/20'}" oninput="const g=parseHijriText(this.value);if(g){$('#iExp').value=g;$('#iExpHo').textContent='= '+fd(g)}"><span class="hint" id="iExpHo"></span></label>
   <label>نبهني قبل (يوم)<input id="iAlert" inputmode="numeric" value="${esc(it.alert??t.alert)}"></label>
   <label>تكلفة التجديد (ر.س)<input id="iCost" inputmode="decimal" value="${esc(it.cost??t.cost)}"></label>
   <label>مدة التجديد (شهر)<input id="iPeriod" inputmode="numeric" value="${esc(it.period||t.period)}"></label>
   <label>غرامة التأخير (ر.س)<input id="iFine" inputmode="decimal" value="${esc(it.fineA??(t.fine.k==='none'?'':t.fine.a))}" placeholder="بدون"><span class="hint">${t.fine.k==='none'?'':FINE_K[t.fine.k]}</span></label>
   <label style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" id="iRep" style="width:auto" ${it.repeat?'checked':''}> سبق تأخرت فيه (غرامة تكرار)</label>
   <label class="full">ملاحظات<textarea id="iNotes" rows="2">${esc(it.notes)}</textarea></label>
   ${t.noImg?'<p class="hint full">🔒 للحماية ما نحفظ صورة البطاقة البنكية ولا رقمها كامل، بس آخر 4 أرقام.</p>':''}`}
function retype(){const type=v('iType');const cur=collectItem({});$('#iOwnerWrap').innerHTML=`<div class="small muted" style="margin-bottom:4px">لمن؟</div>${ownerSelectHTML(formOwner.kind,formOwner.id,type)}`;
  const keep={number:cur.number,provider:cur.provider,issue:cur.issue,expiry:cur.expiry,notes:cur.notes,title:cur.title,lastDone:cur.lastDone};$('#iDyn').innerHTML=dynFields(keep,type)}
function collectItem(base){const type=v('iType');const t=T(type||'other');const o={...base,type};
  const num=s=>s===''?null:+s;
  if(t.periodic){o.lastDone=v('iLast');o.interval=num(v('iInt'));o.alert=num(v('iAlert'));o.cost=num(v('iCost'));o.notes=v('iNotes');delete o.expiry}
  else{if($('#iTitle'))o.title=v('iTitle');o.number=type==='bank_card'?toEn(v('iNum')).replace(/\D/g,'').slice(-4):v('iNum');o.provider=v('iProv');o.issue=v('iIssue');o.expiry=v('iExp');
    o.alert=num(v('iAlert'));o.cost=num(v('iCost'));o.period=num(v('iPeriod'));o.fineA=num(v('iFine'));o.repeat=!!($('#iRep')&&$('#iRep').checked);o.notes=v('iNotes')}
  if(o.alert===t.alert)o.alert=null;if(o.cost===t.cost)o.cost=null;if(o.period===t.period)o.period=null;if(o.fineA===t.fine.a)o.fineA=null;
  return o}
async function saveItem(id,extra){const type=v('iType');if(!type){toast('اختر النوع');return}
  const o=collectItem(id?clean(S.items[id]):{state:'active',createdAt:Date.now(),imgs:[]});Object.assign(o,extra||{});
  o.ownerKind=formOwner.kind||(T(type).owner==='none'?'none':'');o.ownerId=formOwner.id||'';
  if(!o.ownerKind&&T(type).owner!=='any'){toast('حدد لمن هذه المتابعة');return}
  if(T(type).periodic?!o.lastDone:!o.expiry){if(!await ask('ما حددت التاريخ. تحفظ بدونه وتكمله بعدين؟','حفظ'))return}
  const iid=id||uid('i');await dbSet('items/'+iid,o);toast('تم الحفظ ✓');closeModal();return iid}
let pendingOwner=null;
function newOwnerFromForm(kind){const snap=collectItem({});Object.keys(snap).forEach(k=>{if(snap[k]==null||snap[k]==='')delete snap[k]});
  const isScan=!!(scan&&scan.imgs);const d=isScan?{...scan.d,...snap}:snap;if(isScan)scan.d=d;pendingOwner={isScan,d};
  if(kind==='person'){const nm=d.holderName||'';const lw=/عامل|سائق|خادم|راعي|driver|worker|labor/i.test(d.job||'');const lr=((LEARN().types||{})[d.type]||{}).rel;editPerson(null,{rel:lr||(lw||d.type==='iqama'?'worker':'family'),name:nm,nationality:d.nationality||'',job:d.job||''})}
  else editCar(null,{plate:d.plate||'',make:d.make||'',model:d.model||'',year:d.year||'',color:d.color||'',vin:d.vin||'',serial:d.serial||''})}
function resumePending(kind,id){const p=pendingOwner;pendingOwner=null;p.d.ownerKind=kind;p.d.ownerId=id;delete p.d.matched;
  setTimeout(()=>{if(p.isScan&&scan){scan.d=p.d;scanForm()}else editItem(null,p.d)},250)}

/* ================= التصوير الذكي: طابور + مراجعة سريعة + تعلّم ================= */
let queue=[],qTotal=0,qSaved=0;
const LEARN=()=>S.settings.learn||{};
const normPlate=s=>norm(s).replace(/[^\p{L}\p{N}]/gu,'');
function startScan(pre){const inp=$('#scanFile');inp.value='';inp.onchange=()=>{const f=[...inp.files];if(!f.length)return;
  if(f.length>1){window._mf=f;window._mp=pre||{};openModal(`<h3>📸 ${f.length} صور<button class="x" onclick="closeModal()">×</button></h3><p>كيف أتعامل معها؟</p>
    <div class="grid g2"><div class="asst" style="--c:var(--pri);cursor:pointer" onclick="beginQueue(_mf.map(x=>[x]),_mp)"><div class="ic">📚</div><div class="tx"><b>كل صورة مستند منفصل</b><small>أقرأها وحدة وحدة وتراجعها بسرعة (${f.length} مستندات)</small></div></div>
    <div class="asst" style="--c:var(--blue);cursor:pointer" onclick="beginQueue([_mf],_mp)"><div class="ic">🪪</div><div class="tx"><b>كلها مستند واحد</b><small>مثل الوجه والخلف لنفس الإقامة أو الاستمارة</small></div></div></div>`)}
  else beginQueue([f],pre||{})};inp.click()}
function beginQueue(groups,pre){queue=groups.map(g=>({files:g,pre:{...pre}}));qTotal=queue.length;qSaved=0;nextInQueue()}
function nextInQueue(){scan=null;if(!queue.length){closeModal();if(qTotal>1)toast(`تم حفظ ${qSaved} من ${qTotal} مستندات ✓`);qTotal=0;return}
  const j=queue.shift();runScan(j.files,j.pre)}
function cancelScan(){queue=[];qTotal=0;scan=null;closeModal()}
const qLabel=()=>qTotal>1?` <span class="chip st-info">${qTotal-queue.length} من ${qTotal}</span>`:'';
async function runScan(files,pre){
  scan={files,imgs:[],d:{...pre},questions:[],raw:''};
  openModal(`<h3><span>📸 قراءة المستند${qLabel()}</span><button class="x" onclick="cancelScan()">×</button></h3><div id="scanBody"><p><span class="spin"></span> جاري تجهيز الصورة...</p><div class="prog"><i id="scanProg"></i></div></div>`);
  try{for(const f of files)scan.imgs.push(await compress(f,1600,.82))}catch(e){$('#scanBody').innerHTML='<p>تعذر قراءة الصورة</p><div class="btns"><button class="btn" onclick="nextInQueue()">التالي</button></div>';return}
  const ai=ST().ai||{};const prog=p=>{const e=$('#scanProg');if(e)e.style.width=Math.round(p*100)+'%'};
  const msg=t=>{const e=$('#scanBody p');if(e)e.innerHTML='<span class="spin"></span> '+t};
  let res=null;
  if(ai.key){msg('🤖 الذكاء الاصطناعي يقرأ المستند ويصنفه...');prog(.35);try{res=await aiExtract(scan.imgs,ai);scan.engine='ai'}catch(e){console.warn(e);scan.aiErr=e.message;toast('تعذر الاتصال بالذكاء الاصطناعي، نجرب القراءة المحلية')}}
  if(!res){msg('🔎 قراءة النص من الصورة (أول مرة تاخذ وقت أطول)...');try{let txt='';for(let k=0;k<scan.imgs.length;k++)txt+=(await ocr(await enhance(scan.imgs[k]),p=>prog((k+p)/scan.imgs.length)))+'\n';scan.raw=txt;res=parseText(txt);scan.engine='ocr'}catch(e){console.warn(e);res={};scan.engine='none'}}
  prog(1);applyExtract(res||{});
  if(ST().autoApprove&&isComplete(scan.d)&&(LEARN().types||{})[scan.d.type]?.n>=2&&scan.d.matched&&!scan.questions.length){scanForm();setTimeout(()=>saveScan(),80);return}
  scanForm()}
function enhance(u){return new Promise(res=>{const im=new Image();im.onload=()=>{const s=Math.min(2.2,2000/Math.max(im.width,im.height));const w=Math.round(im.width*s),h=Math.round(im.height*s);
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(im,0,0,w,h);const D=x.getImageData(0,0,w,h),a=D.data;let mn=255,mx=0;
  for(let i=0;i<a.length;i+=4){const g=a[i]*.3+a[i+1]*.59+a[i+2]*.11;a[i]=g;if(g<mn)mn=g;if(g>mx)mx=g}const r=255/Math.max(1,mx-mn);
  for(let i=0;i<a.length;i+=4){const g=Math.max(0,Math.min(255,(a[i]-mn)*r));a[i]=a[i+1]=a[i+2]=g}x.putImageData(D,0,0);res(c.toDataURL('image/png'))};im.onerror=()=>res(u);im.src=u})}
function isComplete(d){if(!d.type)return false;const t=T(d.type);if(!d.ownerKind&&t.owner!=='none'&&t.owner!=='any')return false;return t.periodic?!!d.lastDone:!!d.expiry}
function applyExtract(r){const d=scan.d;const L=LEARN();
  for(const k of ['type','title','holderName','number','provider','plate','make','model','year','color','vin','serial','nationality','job','cost','notes'])if(r[k]!=null&&r[k]!==''&&d[k]==null)d[k]=r[k];
  if(r.kind==='person_photo'||r.kind==='vehicle_photo')d.kind=r.kind;
  const fix=(g,h)=>{let x=null;if(h)x=parseHijriText(h);if(!x&&g&&/^\d{4}-\d{2}-\d{2}$/.test(g))x=g;return x};
  const ex=fix(r.expiryDate,r.expiryHijri);if(ex)d.expiry=ex;const is=fix(r.issueDate,r.issueHijri);if(is)d.issue=is;
  if(r.lastDone)d.lastDone=r.lastDone;
  if(d.type==='bank_card'){d.number=String(r.last4||d.number||'').replace(/\D/g,'').slice(-4)}
  if(d.type&&!TYPES[d.type])d.type='other';
  scan.ext={type:d.type||'',expiry:d.expiry||'',issue:d.issue||'',number:d.number||'',expiryHijri:r.expiryHijri||''}; // ما قرأه البرنامج قبل مراجعتك
  scan.questions=(r.questions||[]).filter(q=>q&&q.q).slice(0,3);
  // المالك: من اللي تعلّمه أولاً، بعدين بالمقارنة
  if(!d.ownerKind){
    const keys=[d.plate,d.vin,d.serial].filter(Boolean).map(normPlate);
    for(const k of keys){const id=(L.plates||{})[k];if(id&&S.vehicles[id]){d.ownerKind='vehicle';d.ownerId=id;d.matched='learn';break}}
    if(!d.ownerKind&&d.holderName){const id=(L.names||{})[norm(d.holderName)];if(id&&S.people[id]){d.ownerKind='person';d.ownerId=id;d.matched='learn'}}
    if(!d.ownerKind&&(d.type&&T(d.type).owner==='vehicle'||d.plate||d.vin)){const c=matchVehicle(d);if(c){d.ownerKind='vehicle';d.ownerId=c._id;d.matched=true}}
    if(!d.ownerKind&&d.holderName){const p=matchPerson(d.holderName);if(p){d.ownerKind='person';d.ownerId=p._id;d.matched=true}}
    if(!d.ownerKind&&scan.raw){const txt=norm(toEn(scan.raw)),flat=txt.replace(/[^\p{L}\p{N}]/gu,'');
      for(const[nm,id]of Object.entries(L.names||{}))if(nm.length>4&&txt.includes(nm)&&S.people[id]){d.ownerKind='person';d.ownerId=id;d.matched='learn';break}
      if(!d.ownerKind)for(const[pl,id]of Object.entries(L.plates||{}))if(pl.length>3&&flat.includes(pl)&&S.vehicles[id]){d.ownerKind='vehicle';d.ownerId=id;d.matched='learn';break}
      if(!d.ownerKind){const want=d.type?T(d.type).owner:'any';
        if(want!=='vehicle'){const p=Object.values(S.people).find(p=>{const tk=norm(p.name).split(/\s+/).filter(w=>w.length>2);return tk.length>=2&&tk.filter(w=>txt.includes(w)).length>=2});if(p){d.ownerKind='person';d.ownerId=p._id;d.matched=true}}
        if(!d.ownerKind&&want!=='person'){const c=Object.values(S.vehicles).find(c=>c.plate&&normPlate(c.plate).length>3&&flat.includes(normPlate(c.plate).replace(/\D/g,'')));if(c){d.ownerKind='vehicle';d.ownerId=c._id;d.matched=true}}}}
  }
  // قيم تعلّمها من نفس النوع (الجهة، التكلفة، مدة التنبيه)
  const lt=d.type&&(L.types||{})[d.type];
  if(lt){for(const k of ['provider','cost','alert','period'])if((d[k]==null||d[k]==='')&&lt[k]!=null&&lt[k]!=='')d[k]=lt[k]}
}
function matchPerson(name){const tk=s=>norm(s).replace(/[^\p{L}\s]/gu,' ').split(/\s+/).filter(w=>w.length>1&&!['بن','ابن','ال','bin','al'].includes(w));
  const a=tk(name);if(!a.length)return null;let best=null,bs=0;
  Object.values(S.people).forEach(p=>{const b=tk(p.name);const sh=a.filter(w=>b.some(x=>x===w||x.includes(w)||w.includes(x))).length;const sc=sh/Math.min(a.length,b.length||1);if(sc>bs){bs=sc;best=p}});
  return bs>=.5?best:null}
function matchVehicle(d){return Object.values(S.vehicles).find(c=>(d.plate&&c.plate&&normPlate(c.plate)===normPlate(d.plate))||(d.vin&&c.vin&&normPlate(c.vin)===normPlate(d.vin))||(d.serial&&c.serial&&normPlate(c.serial)===normPlate(d.serial)))||null}

function reviewHTML(d){const t=T(d.type);const o=d.ownerKind==='person'?S.people[d.ownerId]:d.ownerKind==='vehicle'?S.vehicles[d.ownerId]:null;
  const due=t.periodic?(d.lastDone?iso(addMonths(pd(d.lastDone),+(d.interval||t.interval))):null):d.expiry;const dl=due?dBetween(today(),due):null;
  const st=dl==null?'nodate':dl<0?'expired':dl<=+(d.alert??t.alert)?'soon':'ok';
  const row=(l,val,ok=true)=>`<dt>${l}</dt><dd>${val||'<span style="color:var(--amber)">غير مقروء</span>'}${val&&ok?' <span style="color:var(--green)">✓</span>':''}</dd>`;
  const nm=o?(d.ownerKind==='vehicle'?vName(o):o.name):(d.ownerKind==='none'?'عام':'');
  return `<div class="card st-${st}" style="border-right:5px solid var(--c)">
   <div style="display:flex;gap:12px;align-items:center;margin-bottom:10px"><div class="av" style="width:60px;height:60px">${o&&o.photo?`<img src="${o.photo}">`:(d.ownerKind==='vehicle'?'🚗':t.ic)}</div>
    <div style="flex:1"><b style="font-size:17px">${t.ic} ${esc(d.type==='other'?(d.title||t.l):t.l)}</b><div class="small muted">${esc(nm)}${d.matched==='learn'?' · 🧠 عرفته من قبل':d.matched?' · 🔗 ربط تلقائي':''}</div></div>
    ${dl!=null?`<div class="cd"><div class="d">${Math.abs(dl)}</div><small>${dl<0?'يوم تأخير':'يوم باقي'}</small></div>`:''}</div>
   <dl class="kv">${row('الرقم',d.number?`<span class="num">${esc(d.type==='bank_card'?'•••• '+d.number:d.number)}</span>`:'',true)}
    ${t.periodic?row('آخر مرة',d.lastDone?fd(d.lastDone):''):`${d.issue?row('الإصدار',fd(d.issue)+' · '+hijS(d.issue)):''}${row('الانتهاء',d.expiry?fd(d.expiry)+' · '+hijS(d.expiry):'')}`}
    ${d.provider?row('الجهة',esc(d.provider)):''}${d.holderName&&d.ownerKind==='person'&&o&&norm(o.name)!==norm(d.holderName)?row('الاسم في المستند',esc(d.holderName),false):''}
    <dt>التنبيه قبل</dt><dd>${+(d.alert??t.alert)} يوم</dd><dt>تكلفة التجديد</dt><dd>${money(+(d.cost??t.cost)||0)}</dd></dl></div>`}

function scanForm(full){if(!scan)return;const d=scan.d;formOwner={kind:d.ownerKind||'',id:d.ownerId||''};
  if(d.kind==='vehicle_photo'||d.kind==='person_photo'){const isCar=d.kind==='vehicle_photo';
    openModal(`<h3><span>${isCar?'🚗 صورة سيارة':'👤 صورة شخص'}${qLabel()}</span><button class="x" onclick="cancelScan()">×</button></h3><img class="big-ph" src="${scan.imgs[0]}">
    <p>هذي صورة ${isCar?'سيارة':'شخص'} وليست مستند. وش تبغى نسوي فيها؟</p>
    <div class="opts">${isCar?Object.values(S.vehicles).map(c=>`<button onclick="setOwnerPhoto('vehicle','${c._id}')">${esc(vName(c))}</button>`).join(''):Object.values(S.people).map(p=>`<button onclick="setOwnerPhoto('person','${p._id}')">${esc(p.name)}</button>`).join('')}</div>
    <div class="btns"><button class="btn" onclick="photoToNew('${isCar?'vehicle':'person'}')">➕ ${isCar?'سيارة':'شخص'} جديد بهذي الصورة</button><button class="btn ghost" onclick="delete scan.d.kind;scanForm()">لا، هذا مستند</button>${queue.length?'<button class="btn ghost" onclick="nextInQueue()">⏭️ تخطي</button>':''}</div>`);return}
  const ex=d.type&&d.ownerKind?activeItems().find(i=>i.type===d.type&&i.ownerKind===d.ownerKind&&i.ownerId===d.ownerId):null;
  scan.existing=ex;if(scan.asNew==null)scan.asNew=false;
  const lt=d.type&&(LEARN().types||{})[d.type];const ai=ST().ai||{};

  if(d.type&&!T(d.type).periodic&&!d.expiry)qs.push('ما قدرت أقرأ تاريخ الانتهاء، اكتبه ميلادي أو هجري.');
  scan.questions.forEach(q=>qs.push(esc(q.q)));
  const ownerQ=!d.ownerKind&&d.type&&!['none','any'].includes(T(d.type).owner);
  openModal(`<h3><span>${quick?'⚡ مراجعة سريعة':'📸 أكمل البيانات'}${qLabel()}</span><button class="x" onclick="cancelScan()">×</button></h3>
  <div style="display:flex;gap:8px;overflow-x:auto;margin-bottom:8px">${scan.imgs.map(x=>`<img src="${x}" onclick="window.open().document.write('<img src=&quot;'+this.src+'&quot; style=&quot;max-width:100%&quot;>')" style="height:${quick?80:110}px;border-radius:12px;border:1px solid var(--line);cursor:zoom-in">`).join('')}</div>
  <p class="small muted" style="margin:0 0 8px">${scan.engine==='ai'?'🤖 قرأه الذكاء الاصطناعي':scan.engine==='ocr'?'🔎 قراءة محلية':''}${lt?` · 🧠 تعلمت من ${lt.n} ${T(d.type).l} قبل`:''}</p>
  ${!ai.key?`<div class="qbox" style="background:var(--amberSoft);border-color:var(--amber)"><b style="color:var(--amber)">⚠️ القراءة الحالية محلية وضعيفة</b><div class="small">عشان البرنامج يقرأ المستند كامل ويعبيه بدالك، فعّل القراءة الذكية المجانية (دقيقة وحدة).</div><div class="btns"><button class="btn sm" onclick="cancelScan();aiSetup()">🤖 فعّلها الحين</button></div></div>`:''}
  ${scan.aiErr?`<div class="small" style="color:var(--red);margin-bottom:8px">خطأ الذكاء الاصطناعي: ${esc(scan.aiErr)}</div>`:''}
  ${ownerQ?`<div class="qbox"><b>🤖 ${qs.shift()}</b><div class="opts">${(T(d.type).owner!=='vehicle'?Object.values(S.people).map(p=>`<button onclick="pickScanOwner('person','${p._id}')">${p.photo?`<img src="${p.photo}">`:''}${esc(p.name)}</button>`).join(''):'')}${(T(d.type).owner!=='person'?Object.values(S.vehicles).map(c=>`<button onclick="pickScanOwner('vehicle','${c._id}')">🚗 ${esc(vName(c))}</button>`).join(''):'')}
    ${T(d.type).owner!=='vehicle'?`<button onclick="newOwnerFromForm('person')">➕ ${d.holderName?'أضف '+esc(d.holderName):'شخص جديد'}</button>`:''}${T(d.type).owner!=='person'?`<button onclick="newOwnerFromForm('vehicle')">➕ سيارة جديدة</button>`:''}</div></div>`:''}
  ${qs.length?`<div class="qbox"><b>🤖 عندي أسئلة</b>${qs.map(q=>`<div class="small" style="margin-bottom:4px">• ${q}</div>`).join('')}</div>`:''}
  ${ex?`<div class="qbox" style="background:var(--amberSoft);border-color:var(--amber)"><b style="color:var(--amber)">🔄 فيه ${esc(tLabel(ex))} مسجل لنفس الشخص ينتهي ${fd(dueDate(ex))}</b><div class="small">هل هذا تجديد له؟</div>
    <div class="opts"><button class="${scan.asNew?'':'on'}" id="exRenew" onclick="scan.asNew=false;this.classList.add('on');$('#exNew').classList.remove('on')">نعم، تجديد (حدّث القديم)</button><button class="${scan.asNew?'on':''}" id="exNew" onclick="scan.asNew=true;this.classList.add('on');$('#exRenew').classList.remove('on')">لا، مستند منفصل</button></div>
    <label class="small" style="display:block;margin-top:6px">المبلغ المدفوع للتجديد<input id="exCost" inputmode="decimal" value="${costOf(ex)||''}"></label></div>`:''}
  ${quick?reviewHTML(d):''}
  <div id="fullForm" style="${quick?'display:none':''}">${itemFormHTML(d,d.type||'')}</div>
  ${scan.raw&&!quick?`<details class="small muted" style="margin-top:8px"><summary>النص المقروء</summary><pre style="white-space:pre-wrap;font-size:11px">${esc(scan.raw.slice(0,1500))}</pre></details>`:''}
  <div class="btns">${quick?`<button class="btn" style="flex:1;padding:13px;font-size:16px" onclick="saveScan()">✅ صحيح، اعتمد واحفظ</button><button class="btn ghost" onclick="scanForm(true)">✏️ تعديل</button>`:`<button class="btn" style="flex:1" onclick="saveScan()">💾 حفظ</button>`}
   ${queue.length?'<button class="btn ghost" onclick="nextInQueue()">⏭️ تخطي</button>':''}<button class="btn ghost" onclick="cancelScan()">إلغاء</button></div>`)}
function pickScanOwner(kind,id){scan.d.ownerKind=kind;scan.d.ownerId=id;scan.d.matched=false;scan.ownerAsked=true;scanForm()}
async function setOwnerPhoto(kind,id){const ph=await compress(dataToBlob(scan.imgs[0]),420,.75);const col=kind==='vehicle'?'vehicles':'people';await dbSet(col+'/'+id,{...clean(S[col][id]),photo:ph});toast('تم تحديث الصورة ✓');qSaved++;nextInQueue()}
async function photoToNew(kind){tmpPhoto=await compress(dataToBlob(scan.imgs[0]),420,.75);const ph=tmpPhoto;queue=[];scan=null;kind==='vehicle'?editCar(null,{photo:ph}):editPerson(null,{photo:ph,rel:'family'})}
function dataToBlob(u){const[h,b]=u.split(',');const bin=atob(b);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:h.match(/:(.*?);/)[1]})}
async function saveScan(){const type=v('iType');if(!type){scanForm(true);toast('اختر النوع');return}
  const ex=scan.existing;const t=T(type);const fin={...collectItem({}),ownerKind:formOwner.kind,ownerId:formOwner.id};
  if(ex&&!scan.asNew&&ex.type===type){
    const o=collectItem(clean(ex));o.ownerKind=ex.ownerKind;o.ownerId=ex.ownerId;
    const old=dueDate(ex);const nd=t.periodic?o.lastDone:o.expiry;
    if(nd&&nd!==old){const late=old?Math.max(0,dBetween(old,today())):0;
      await dbSet('history/'+uid('h'),{itemId:ex._id,type,title:tLabel(ex),ownerKind:ex.ownerKind,ownerId:ex.ownerId,ownerLabel:ownerLabel(ex),oldDue:old||'',newDue:t.periodic?iso(addMonths(pd(nd),+(o.interval||t.interval))):nd,renewedOn:today(),cost:+v('exCost')||0,fine:fineAt(ex),lateDays:late,note:'من التصوير'});}
    o.state='active';if(!t.noImg){o.imgs=[...(ex.imgs||[])];for(const x of scan.imgs)o.imgs.push(await imgPut(x))}
    await dbSet('items/'+ex._id,o);await learnFrom({...fin,ownerKind:ex.ownerKind,ownerId:ex.ownerId});toast('تم تحديث المستند ✓');qSaved++;nextInQueue();return}
  if(!fin.ownerKind&&!['none','any'].includes(t.owner)){scanForm(true);toast('حدد لمن هذا المستند');return}
  const imgs=[];if(!t.noImg)for(const x of scan.imgs){try{imgs.push(await imgPut(x))}catch(e){}}
  const r=await saveItem(null,{imgs,engine:scan.engine});if(r){await learnFrom(fin);qSaved++;nextInQueue()}}

/* ----- التعلّم من مراجعتك ----- */
async function learnFrom(fin){try{if(!scan)return;const L=JSON.parse(JSON.stringify(clean(LEARN())));const d=scan.d,e=scan.ext||{};
  L.names=L.names||{};L.plates=L.plates||{};L.types=L.types||{};L.misc=L.misc||[];
  if(fin.ownerKind==='person'&&d.holderName)L.names[norm(d.holderName)]=fin.ownerId;

  const t=L.types[fin.type]=L.types[fin.type]||{n:0,ex:[],fix:[],kw:{}};t.n=(t.n||0)+1;

let tessP=null;function loadTess(){if(window.Tesseract)return Promise.resolve();if(!tessP)tessP=new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s)});return tessP}
async function ocr(img,prog){await loadTess();const r=await Tesseract.recognize(img,'ara+eng',{logger:m=>{if(m.status==='recognizing text')prog(.35+m.progress*.6);else prog(.1)}});return r.data.text||''}
function parseText(raw){const t=toEn(raw);const low=norm(t);const r={questions:[]};
  let best=null,bs=0;const LT=LEARN().types||{};TYPE_ORDER.forEach(k=>{let sc=(TYPES[k].kw||[]).filter(w=>low.includes(norm(w))).length;const kw=Object.keys((LT[k]||{}).kw||{});if(kw.length)sc+=kw.filter(w=>low.includes(w)).length/kw.length*3;if(sc>bs){bs=sc;best=k}});if(best)r.type=best;
  const dates=[];const re=/(\d{1,4})\s*[\/\-\.]\s*(\d{1,2})\s*[\/\-\.]\s*(\d{2,4})/g;let m;
  while((m=re.exec(t))){let a=+m[1],b=+m[2],c=+m[3];let g=null,hj=false;
    if(a>1300&&a<1600){g=h2g(a,b,c);hj=true}else if(c>1300&&c<1600){g=h2g(c,b,a);hj=true}
    else if(a>1900&&a<2100){g=iso(new Date(a,b-1,c))}else if(c>1900&&c<2100){g=iso(new Date(c,b-1,a))}
    else if(c<100&&a<=31&&b<=12){g=iso(new Date(2000+c,b-1,a))}
    if(g)dates.push({g,hj,idx:m.index})}
  const mm=t.match(/(\d{2})\s*\/\s*(\d{2})(?!\s*\/)/);if(!dates.length&&mm&&r.type==='bank_card'){const mo=+mm[1],yy=+mm[2];if(mo>=1&&mo<=12)dates.push({g:iso(new Date(2000+yy,mo,0)),idx:0})}
  if(dates.length){dates.sort((a,b)=>a.g.localeCompare(b.g));const fut=dates.filter(x=>x.g>=iso(addMonths(new Date(),-24)));r.expiryDate=(fut.length?fut:dates)[ (fut.length?fut:dates).length-1].g;if(dates.length>1&&dates[0].g<r.expiryDate)r.issueDate=dates[0].g}
  const ids=t.match(/\b[12]\d{9}\b/);if(ids&&['iqama','national_id','driving_license','other'].includes(r.type||'other'))r.number=ids[0];
  const pp=t.match(/\b[A-Z]{1,2}\d{6,8}\b/);if(pp&&r.type==='passport')r.number=pp[0];
  if(r.type==='bank_card'){const c=t.replace(/\s/g,'').match(/\d{16}/);if(c)r.last4=c[0].slice(-4)}
  const vin=t.match(/\b[A-HJ-NPR-Z0-9]{17}\b/);if(vin)r.vin=vin[0];
  const nm=t.match(/(?:الاسم|Name)\s*[:：]?\s*([^\n]{3,40})/i);if(nm)r.holderName=nm[1].trim();
  return r}

async function saveFile(filename,data){const ext=filename.split('.').pop().toLowerCase();const types={csv:'text/csv',html:'text/html',json:'application/json',ics:'text/calendar'};
  const blob=data instanceof Blob?data:new Blob([data],{type:(types[ext]||'application/octet-stream')+';charset=utf-8'});
  if(ext!=='ics'&&navigator.canShare&&/iPhone|iPad|Android/i.test(navigator.userAgent)){try{const f=new File([blob],filename,{type:blob.type});if(navigator.canShare({files:[f]})){await navigator.share({files:[f],title:filename});return}}catch(e){if(e.name==='AbortError')return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast('تم التنزيل ✓')}

function icsDate(s){return s.replace(/-/g,'')}
function fold(line){const out=[];let cur='',bytes=0;for(const ch of line){const b=new TextEncoder().encode(ch).length;if(bytes+b>73){out.push(cur);cur=' ';bytes=1}cur+=ch;bytes+=b}out.push(cur);return out.join('\r\n')}
const icsEsc=s=>String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
function dlICS(ids){const L=(ids?ids.map(i=>S.items[i]):activeItems()).filter(i=>i&&dueDate(i));if(!L.length){toast('ما فيه مواعيد');return}
  const now=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  const ev=L.map(i=>{const d=dueDate(i);const a=alertOf(i);const t=T(i.type);
    return ['BEGIN:VEVENT','UID:'+i._id+'@abunabi-renewals','DTSTAMP:'+now,'DTSTART;VALUE=DATE:'+icsDate(d),'DTEND;VALUE=DATE:'+icsDate(iso(addDays(pd(d),1))),
    'SUMMARY:'+icsEsc(`${t.ic} ${t.periodic?'موعد':'انتهاء'} ${tLabel(i)} - ${ownerLabel(i)}`),
    'DESCRIPTION:'+icsEsc(`${i.number?'الرقم: '+maskNum(i)+'\n':''}تكلفة التجديد: ${money(costOf(i))}\n${t.where?'التجديد: '+t.where+'\n':''}${t.req?'المتطلبات: '+t.req:''}`),
    'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(`باقي ${a} يوم على ${tLabel(i)} ${ownerLabel(i)}`),'TRIGGER:-P'+Math.max(0,a-1)+'DT15H','END:VALARM',
    ...(a>7?['BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(`باقي أسبوع على ${tLabel(i)} ${ownerLabel(i)}`),'TRIGGER:-P6DT15H','END:VALARM']:[]),
    'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(`اليوم ينتهي ${tLabel(i)} ${ownerLabel(i)}`),'TRIGGER:PT9H','END:VALARM','END:VEVENT'].map(fold).join('\r\n')});
  const cal=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//abunabi//renewals//AR','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:الانتهاءات',...ev,'END:VCALENDAR'].join('\r\n');
  saveFile(ids&&ids.length===1?`${tLabel(L[0])}.ics`:`الانتهاءات-${today()}.ics`,cal)}

  document.querySelector('meta[name=theme-color]').content=t==='dark'?'#0b4d47':'#0f766e'}
function toggleTheme(){localStorage.setItem('rn_theme',(localStorage.getItem('rn_theme')==='dark')?'':'dark');applyTheme()}
applyTheme();

/* ================= النوافذ ================= */
function openModal(html){$('#sheet').innerHTML=html;$('#modal').classList.remove('hidden');document.body.style.overflow='hidden';$('#sheet').scrollTop=0}
function closeModal(){$('#modal').classList.add('hidden');document.body.style.overflow=''}
function ask(msg,okLabel='تأكيد'){return new Promise(res=>{const prev=$('#modal').classList.contains('hidden')?null:$('#sheet').innerHTML;
  openModal(`<h3>تأكيد<button class="x" id="noX">×</button></h3><p>${msg}</p><div class="btns"><button class="btn warn" id="okA">${okLabel}</button><button class="btn ghost" id="noA">إلغاء</button></div>`);
  const back=()=>{if(prev){$('#sheet').innerHTML=prev}else closeModal()};
  $('#okA').onclick=()=>{back();res(true)};$('#noA').onclick=$('#noX').onclick=()=>{back();res(false)}})}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
setInterval(()=>{if(fbUser&&$('#modal').classList.contains('hidden'))schedule_render()},60*60*1000); // تحديث العداد كل ساعة
</script>
